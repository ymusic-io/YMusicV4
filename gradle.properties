# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android settings
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
# Allow Gradle Managed Devices on API <= 26 (we run :kmpFfmpeg ymix instrumented tests on API 24).
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true

# Kotlin settings
kotlin.code.style=official

# Kotlin Multiplatform
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false

# Configure only the targets the current host can build (so the IDE/Gradle never tries to generate
# another OS's cinterop, e.g. the Linux libcurl binding on macOS). Override with -PkmpTargets=all to
# configure every target (e.g. when publishing). See buildSrc KmpTargets.kt.
kmpTargets=host

# The app version name, shared by Android, desktop and iOS (Xcode stamps it into Info.plist).
# Version codes stay per platform, in each app.
ymusic.versionName=4.0.13
