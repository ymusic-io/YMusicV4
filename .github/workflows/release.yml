name: release

# The shipping build, run by pushing a release tag: git tag release-v4.0.0 && git push <remote> release-v4.0.0
# Any branch: the tag alone picks the commit. The draft release waits for the tests and the bundle
# compat check as well as the builds.
# A prerelease-v* tag is a test build: the same full set of artifacts in a draft prerelease, no
# CHANGELOG section in its notes, and Sentry environment "beta".
# A push to master or a ci/* branch runs every build and test with Sentry environment "beta" and
# releases nothing: no secrets.enc, no signing or notarizing, no Sentry upload, no draft release. The
# release job only collects and checksums the files there, which checks every artifact's name.
# The schedule runs the master build twice a week (a release can be weeks away): GitHub evicts a cache
# entry 7 days after its last use, and each run restores every entry, ffmpeg's and the NDK first.
# workflow_dispatch runs it by hand; dispatched on a tag it is that tag's release build.
on:
  push:
    tags: ['release-*', 'prerelease-*']
    branches: [master, 'ci/**']
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

# A master run is never cancelled: a newer push queues behind it, so every master run saves its caches.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Every step that signs, uploads, publishes or reads a release secret runs on a tag only.
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
  # Only master saves caches. A cache belongs to the ref that saved it, and a run reads its own ref's
  # and master's: a tag's entries could never be read again, so tags and ci/** only restore. Every key
  # is built from the cache's real inputs (pins, lockfiles, OS/arch), never the ref or commit, so a tag
  # restores exactly what master saved.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/master' }}
  # Read by every Gradle run as -PsentryEnvironment.
  ORG_GRADLE_PROJECT_sentryEnvironment: ${{ startsWith(github.ref, 'refs/tags/release-') && 'production' || 'beta' }}
  # The same for the Rust desktop app's cargo builds (desktopRust reads it at compile time).
  YMUSIC_SENTRY_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/release-') && 'production' || 'beta' }}
  # On a tag the Rust desktop build fails without its release keys (update key, Sentry DSN, config
  # service): a build without the update key could never update itself again.
  YMUSIC_REQUIRE_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
  # The ffmpeg-build commit the apps link against. Bumping it rebuilds every ffmpeg pack once (on the
  # next master run, which saves it); otherwise each pack comes from the cache keyed on this ref.
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: 4d2dc9ae0c73dc5f01733f18af070412013a6a93
  # The NDK (r28c) for the Android ffmpeg packs and the app's own native code, installed with the
  # runner's sdkmanager: the image's ANDROID_NDK_LATEST_HOME moves (r30 fails android-x86_64).
  NDK_VERSION: 28.2.13676358
  # The installer msys2/setup-msys2 (pinned below) extracts; both must change together. The Seed MSYS2
  # installer step fetches it from GitHub or a mirror into the tool cache, where setup-msys2 looks first.
  MSYS2_INSTALLER_DATE: '2026-09-27'
  MSYS2_INSTALLER_SHA256: ad336cccfda47758b5e15cda993fbba421115cb0b126697daef1ee4dfe37209f
  # The desktop app's Rust toolchain, and the pinned AppImage tooling (checked by SHA-256 in the linux
  # job; appimagetool would otherwise fetch the runtime's moving "continuous" build).
  RUST_TOOLCHAIN: 1.99.1
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGE_RUNTIME_VERSION: '20251108'
  # The sentry-cli the release job uploads the desktop debug files with, checked by SHA-256.
  SENTRY_CLI_VERSION: '3.8.2'
  SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3

jobs:
  # The checkouts sit side by side (YMusicV4/ + ffmpeg-build/): the Gradle and desktop builds read
  # ../ffmpeg-build/out/<slug>, exactly as on a developer machine.
  # One job per platform, so a platform's build waits only for its own ffmpeg packs.
  ffmpeg-android:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: android-armeabi-v7a, runner: ubuntu-24.04 }
          - { slug: android-arm64-v8a, runner: ubuntu-24.04 }
          - { slug: android-x86, runner: ubuntu-24.04 }
          - { slug: android-x86_64, runner: ubuntu-24.04 }
    steps:
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          # Android packs also key on the NDK: a pack must not outlive the toolchain it was built with.
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      # The NDK from the cache the android job saves; sdkmanager, retried, when that misses.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # ANDROID_HOME of the ubuntu-24.04 image (a with: input cannot read the runner's env).
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ "$ANDROID_HOME" = /usr/local/lib/android/sdk ] ||
            echo "::warning::ANDROID_HOME is $ANDROID_HOME: the NDK cache path no longer matches it"
          for attempt in 1 2 3; do
            [ -f "$ndk/source.properties" ] && break
            rm -rf "$ndk"
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::sdkmanager could not install ndk;$NDK_VERSION, retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null || true
          done
          [ -f "$ndk/source.properties" ] || { echo "::error::sdkmanager could not install ndk;$NDK_VERSION" >&2; exit 1; }
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ffmpeg-build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "${SLUG#android-}" || {
            # A dependency's configure failure prints only its verdict; the reason is in its log.
            for log in .deps-$SLUG/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }
        env:
          SLUG: ${{ matrix.slug }}

      - if: steps.cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The builds take the pack from this job, not from the cache: a tag's miss is never saved. tar keeps
      # the executable bits and symlinks an artifact would drop.
      - name: Hand the pack on
        run: tar -cf "ffmpeg-$SLUG.tar" -C ffmpeg-build/out "$SLUG"
        env:
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-${{ matrix.slug }}.tar
          retention-days: 7
          if-no-files-found: error

  ffmpeg-macos:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: macos-arm64, runner: macos-15 }
          - { slug: macos-x86_64, runner: macos-15-intel }
    steps:
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ffmpeg-build
        run: |
          brew install nasm automake autoconf libtool pkg-config meson ninja
          scripts/build-desktop.sh

      - if: steps.cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The builds take the pack from this job, not from the cache: a tag's miss is never saved. tar keeps
      # the executable bits and symlinks an artifact would drop.
      - name: Hand the pack on
        run: tar -cf "ffmpeg-$SLUG.tar" -C ffmpeg-build/out "$SLUG"
        env:
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-${{ matrix.slug }}.tar
          retention-days: 7
          if-no-files-found: error

  # In the desktop packages' ubuntu:22.04 container, so the libav it builds needs glibc 2.35 too.
  ffmpeg-linux:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: linux-x86_64, runner: ubuntu-24.04 }
          - { slug: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      # zstd before the restore: the entries are zstd tarballs, and without it the cache misses.
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-ubuntu22.04-${{ env.FFMPEG_BUILD_REF }}

      # git before the checkout: without it actions/checkout falls back to a tarball, which has no submodules.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl \
            build-essential nasm automake autoconf libtool pkg-config meson ninja-build python3 patchelf zlib1g-dev
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ffmpeg-build
        run: |
          git config --global --add safe.directory '*'
          scripts/build-desktop.sh || {
            for log in .deps/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }

      - if: steps.cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The builds take the pack from this job, not from the cache: a tag's miss is never saved. tar keeps
      # the executable bits and symlinks an artifact would drop.
      - name: Hand the pack on
        run: tar -cf "ffmpeg-$SLUG.tar" -C ffmpeg-build/out "$SLUG"
        env:
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-${{ matrix.slug }}.tar
          retention-days: 7
          if-no-files-found: error

  ffmpeg-windows:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native under MSYS2, as on a developer machine. CLANGARM64 has no gcc: HOST_CC is
          # ffmpeg's compiler, which its configure otherwise assumes is gcc.
          - slug: windows-x86_64
            runner: windows-2022
            msystem: MINGW64
            cc: gcc
            packages: >-
              mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
              mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib
          - slug: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            cc: clang
            packages: >-
              mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-pkgconf
              mingw-w64-clang-aarch64-meson mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-zlib
    steps:
      # The Windows runner checks out with CRLF, which breaks every shell script ffmpeg-build runs.
      - run: git config --global core.autocrlf false

      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msys2-installer
          key: msys2-installer-${{ env.MSYS2_INSTALLER_DATE }}-${{ env.MSYS2_INSTALLER_SHA256 }}
      - name: Seed MSYS2 installer
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          day="${MSYS2_INSTALLER_DATE//-/}"
          file="msys2-base-x86_64-$day.sfx.exe"
          dir="$(cygpath -u "$RUNNER_TOOL_CACHE")/msys2-installer/0.0.$day/x64"
          cached=msys2-installer/base.exe
          mkdir -p "$dir" msys2-installer
          verified() { echo "$MSYS2_INSTALLER_SHA256  $cached" | sha256sum -c --status; }
          seed() { cp "$cached" "$dir/base.exe"; touch "$dir.complete"; echo "MSYS2 installer from $1"; exit 0; }
          if [ -f "$cached" ] && verified; then seed "the cache"; fi
          for url in \
            "https://github.com/msys2/msys2-installer/releases/download/$MSYS2_INSTALLER_DATE/$file" \
            "https://repo.msys2.org/distrib/x86_64/$file" \
            "https://mirror.msys2.org/distrib/x86_64/$file" \
            "https://mirrors.tuna.tsinghua.edu.cn/msys2/distrib/x86_64/$file"; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o "$cached" "$url" && verified; then
              seed "$url"
            fi
            echo "::warning::MSYS2 installer download failed: $url"
          done
          echo "::error::MSYS2 installer: every source failed"
          exit 1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make diffutils autoconf automake libtool patch ${{ matrix.packages }}
          # Runs only when ffmpeg rebuilds: a package cache would expire unused between rebuilds.
          cache: false

      - if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffmpeg-build
        env:
          HOST_CC: ${{ matrix.cc }}
        run: |
          scripts/build-desktop.sh || {
            for log in .deps/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }

      - if: steps.cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The builds take the pack from this job, not from the cache: a tag's miss is never saved. tar keeps
      # the executable bits and symlinks an artifact would drop.
      - name: Hand the pack on
        shell: bash
        run: tar -cf "ffmpeg-$SLUG.tar" -C ffmpeg-build/out "$SLUG"
        env:
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-${{ matrix.slug }}.tar
          retention-days: 7
          if-no-files-found: error

  android:
    needs: ffmpeg-android
    runs-on: ubuntu-24.04
    env:
      # Whether to open secrets.enc (a tag, and the repo has its passphrase); the passphrase itself goes to
      # the Restore secrets step alone.
      HAS_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SECRETS_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ffmpeg-android-*
          path: ffmpeg-packs
          merge-multiple: true
      - name: Unpack the ffmpeg packs
        run: |
          mkdir -p ffmpeg-build/out
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            tar -xf "ffmpeg-packs/ffmpeg-android-$abi.tar" -C ffmpeg-build/out
          done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Gradle User Home (wrapper, dependencies, the build cache), saved by master only.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}
      # The npm cache npx installs esbuild and typescript from, keyed on their pins.
      - id: npx
        working-directory: YMusicV4
        shell: bash
        run: |
          version() { sed -n "s/.*const val $1 = \"\([^\"]*\)\".*/\1/p" buildSrc/src/main/kotlin/Dependencies.kt; }
          echo "key=npx-$RUNNER_OS-$RUNNER_ARCH-esbuild$(version esbuild)-typescript$(version typescript)" >> "$GITHUB_OUTPUT"
      - id: npx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}
      # The ffmpeg packs' NDK, for :quickjs and :mse's CMake builds (they honor ANDROID_NDK_ROOT). Cached
      # (saved by master), so a release does not depend on Google's download, which flakes.
      - id: ndk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # ANDROID_HOME of the ubuntu-24.04 image (a with: input cannot read the runner's env).
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ "$ANDROID_HOME" = /usr/local/lib/android/sdk ] ||
            echo "::warning::ANDROID_HOME is $ANDROID_HOME: the NDK cache path no longer matches it"
          for attempt in 1 2 3; do
            [ -f "$ndk/source.properties" ] && break
            rm -rf "$ndk"
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::sdkmanager could not install ndk;$NDK_VERSION, retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null || true
          done
          [ -f "$ndk/source.properties" ] || { echo "::error::sdkmanager could not install ndk;$NDK_VERSION" >&2; exit 1; }
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - if: steps.ndk.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ${{ steps.ndk.outputs.cache-primary-key }}

      # secrets.enc → secrets.properties + signing/. Off a tag, or without SECRETS_PASSPHRASE, the build
      # runs on defaults: debug-signed, no Sentry upload, no remote config.
      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        working-directory: YMusicV4
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: ./decrypt.sh

      # With the decrypted sentry.auth.token the Sentry plugin uploads the ProGuard mapping and
      # source context for this build, so crashes from the shipped APKs symbolicate.
      - name: Assemble release APKs
        working-directory: YMusicV4
        run: ./gradlew -Pproduction=true :androidApp:assembleRelease :engine-js:closureJs :engine-js:closurePlayerJs
      - if: steps.npx-cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: rm -rf secrets.properties signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apks
          path: YMusicV4/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The scrape engine and MSE player bundles this release ships, for publishing as remote updates,
      # each named by the revision the build stamped into it (Versions.engineJsVersion / playerJsVersion).
      - name: Name the JS bundles by version
        working-directory: YMusicV4
        run: |
          set -euo pipefail
          version() {
            v="$(sed -n "s/.*const val $1 = \([0-9][0-9]*\)L.*/\1/p" buildSrc/src/main/kotlin/Dependencies.kt)"
            [ -n "$v" ] || { echo "$1 not found in buildSrc Dependencies.kt" >&2; exit 1; }
            echo "$v"
          }
          engine="$(version engineJsVersion)"
          player="$(version playerJsVersion)"
          mkdir -p "$RUNNER_TEMP/js-bundles"
          cp engine-js/build/dist/engine.js "$RUNNER_TEMP/js-bundles/engine.$engine.js"
          cp engine-js/build/dist/player.js "$RUNNER_TEMP/js-bundles/player.$player.js"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-bundles
          path: ${{ runner.temp }}/js-bundles/*.js
          if-no-files-found: error

  # engine.js / player.js for the desktop builds, which embed them (the android job builds its own).
  engine-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Restore-only: master's android job's entry (the only Linux one) holds all this build needs, and
      # a second set of Linux dependency entries would only take cache budget.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      # The npm cache npx installs esbuild and typescript from, keyed on their pins.
      - id: npx
        working-directory: YMusicV4
        shell: bash
        run: |
          version() { sed -n "s/.*const val $1 = \"\([^\"]*\)\".*/\1/p" buildSrc/src/main/kotlin/Dependencies.kt; }
          echo "key=npx-$RUNNER_OS-$RUNNER_ARCH-esbuild$(version esbuild)-typescript$(version typescript)" >> "$GITHUB_OUTPUT"
      - id: npx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}
      - working-directory: YMusicV4
        run: ./gradlew -Pproduction=true :engine-js:closureJs :engine-js:closurePlayerJs
      - if: steps.npx-cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-js
          path: |
            YMusicV4/engine-js/build/dist/engine.js
            YMusicV4/engine-js/build/dist/player.js
          if-no-files-found: error

  # The desktop app is the Rust one in desktopRust/ (the Kotlin :desktopApp is for
  # development only). It builds against this checkout (YMUSIC_V4_DIR: C sources, strings, icons,
  # the version line) and ../ffmpeg-build, as on a developer machine.
  #
  # The DMG: on a tag the shipped bundle (--release: the JVM app's bundle id, which its updater and
  # Keychain item follow, the Developer ID from MACOS_CERT_P12, hardened runtime, notarized with
  # secrets.enc's mac.notarization.*); any of them missing fails the job. Off a tag, the same release
  # build in an ad-hoc signed DMG under the dev bundle id (--dmg), which needs no secret.
  macos:
    name: macos ${{ matrix.slug }}
    needs: [engine-js, ffmpeg-macos]
    runs-on: ${{ matrix.runner }}
    env:
      # Whether to open secrets.enc (a tag, and the repo has its passphrase); the passphrase itself goes to
      # the Restore secrets step alone.
      HAS_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SECRETS_PASSPHRASE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: macos-arm64, runner: macos-15 }
          - { slug: macos-x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-js
          path: YMusicV4/engine-js/build/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-packs
      - name: Unpack the ffmpeg pack
        run: mkdir -p ffmpeg-build/out && tar -xf "ffmpeg-packs/ffmpeg-${{ matrix.slug }}.tar" -C ffmpeg-build/out

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # The registry plus target/ trimmed to the registry dependencies, keyed on the toolchain and
      # Cargo.lock; a new lockfile restores the newest same-target entry. rust-cache drops every crate under
      # desktopRust/ before the save, the vendored gpui patches included, so those rebuild every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: YMusicV4/desktopRust -> target
          key: ${{ matrix.slug }}
          cache-bin: false
          save-if: ${{ env.SAVE_CACHE == 'true' }}

      # secrets.enc → secrets.properties + signing/; the Rust build reads its keys from
      # secrets.properties and, on a tag, fails without them (YMUSIC_REQUIRE_SECRETS).
      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        working-directory: YMusicV4
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          ./decrypt.sh

      # Repository secrets (not secrets.enc), as ffmpeg-build's release signing had them:
      #   MACOS_CERT_P12       Developer ID .p12, base64:  base64 -i cert.p12 | pbcopy
      #   MACOS_CERT_PASSWORD  its export password
      # The identity goes into a throwaway keychain, and its name becomes CODESIGN_IDENTITY for the
      # bundle script.
      - name: Import signing identity
        if: env.IS_TAG == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no MACOS_CERT_P12: the 4.0.x updater installs only a DMG signed by the YMusic team" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          [ -s "$CERT" ] || { echo "MACOS_CERT_P12 is empty or is not base64" >&2; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without this the keychain relocks mid-build and codesign waits on a UI prompt.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A wrong password fails here loudly. A .p12 exported from Keychain Access's "Keys"
          # category holds the private key alone and imports silently — caught just below.
          security import "$CERT" -P "$MACOS_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERT"
          if [ "$(security find-certificate -a "$KEYCHAIN" 2>/dev/null | grep -c '^keychain:')" -lt 1 ]; then
            echo "the .p12 holds a private key but no certificate. Re-export the identity from" >&2
            echo "Keychain Access under \"My Certificates\", not under \"Keys\"." >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Appended, not substituted: the runner's keychains carry the Apple intermediates the chain needs.
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d ' "')

          echo "identities in the signing keychain:"
          security find-identity -p codesigning "$KEYCHAIN" | sed 's/^/  /'
          # sed, not grep: a non-matching grep under pipefail would abort before the diagnosis prints.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n '/Developer ID Application/{s/.*"\(.*\)".*/\1/p;q;}')"
          if [ -z "$IDENTITY" ]; then
            echo "no VALID Developer ID Application identity. From the listing above:" >&2
            echo "  listed, but not valid -> the .p12 is missing its intermediate certificate" >&2
            echo "  not listed at all     -> wrong MACOS_CERT_PASSWORD, or not a Developer ID .p12" >&2
            exit 1
          fi
          echo "signing as: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Runs the packed ffmpeg through the app's process runner: it must start, and its Duration line
      # (the Library's durations and @size:seconds playlist codes) must keep its formatting. Its debug
      # build goes outside target/, which the rust cache saves for the release build alone.
      - name: Check the packed ffmpeg
        working-directory: YMusicV4/desktopRust
        run: |
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          CARGO_TARGET_DIR="$RUNNER_TEMP/ffmpeg-test" cargo test -p ym-ffmpeg --test duration_format

      - name: Package the DMG
        working-directory: YMusicV4/desktopRust
        run: |
          set -euo pipefail
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          if [ "$IS_TAG" != true ]; then
            tools/bundle-macos.sh --dmg --out "$GITHUB_WORKSPACE/dist"
            exit 0
          fi
          property() { sed -n "s/^$1=//p" "$YMUSIC_V4_DIR/secrets.properties" 2>/dev/null | head -n 1; }
          YMUSIC_MAC_APPLE_ID="$(property mac.notarization.appleId)" \
          YMUSIC_MAC_APPLE_PASSWORD="$(property mac.notarization.password)" \
          YMUSIC_MAC_TEAM_ID="$(property mac.notarization.teamId)" \
            tools/bundle-macos.sh --release --out "$GITHUB_WORKSPACE/dist"

      - name: Discard secrets
        if: always()
        run: |
          rm -rf YMusicV4/secrets.properties YMusicV4/signing
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-debug
          path: dist/debug
          if-no-files-found: error

  # The staged app folder (YMusic.exe, ffmpeg.exe, DLLs) that windows-setup signs and packs. x86_64 on
  # the windows-gnu Rust host with MSYS2's MinGW gcc; arm64 on the aarch64-pc-windows-gnullvm host
  # with CLANGARM64's clang (MSYS2 has no arm64 gcc).
  windows:
    name: windows ${{ matrix.slug }}
    needs: [engine-js, ffmpeg-windows]
    runs-on: ${{ matrix.runner }}
    env:
      # Whether to open secrets.enc (a tag, and the repo has its passphrase); the passphrase itself goes to
      # the Restore secrets step alone.
      HAS_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SECRETS_PASSPHRASE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: windows-x86_64, runner: windows-2022, msystem: MINGW64, prefix: mingw64,
              host: x86_64-pc-windows-gnu, packages: 'mingw-w64-x86_64-toolchain' }
          - { slug: windows-arm64, runner: windows-11-arm, msystem: CLANGARM64, prefix: clangarm64,
              host: aarch64-pc-windows-gnullvm, packages: 'mingw-w64-clang-aarch64-toolchain' }
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-js
          path: YMusicV4/engine-js/build/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-packs
      - name: Unpack the ffmpeg pack
        shell: bash
        run: mkdir -p ffmpeg-build/out && tar -xf "ffmpeg-packs/ffmpeg-${{ matrix.slug }}.tar" -C ffmpeg-build/out

      # The MinGW toolchain for the C sources (GCC/Clang-only C; MSVC rejects it).
      - id: msys2-installer
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msys2-installer
          key: msys2-installer-${{ env.MSYS2_INSTALLER_DATE }}-${{ env.MSYS2_INSTALLER_SHA256 }}
      - name: Seed MSYS2 installer
        shell: bash
        run: |
          set -euo pipefail
          day="${MSYS2_INSTALLER_DATE//-/}"
          file="msys2-base-x86_64-$day.sfx.exe"
          dir="$(cygpath -u "$RUNNER_TOOL_CACHE")/msys2-installer/0.0.$day/x64"
          cached=msys2-installer/base.exe
          mkdir -p "$dir" msys2-installer
          verified() { echo "$MSYS2_INSTALLER_SHA256  $cached" | sha256sum -c --status; }
          seed() { cp "$cached" "$dir/base.exe"; touch "$dir.complete"; echo "MSYS2 installer from $1"; exit 0; }
          if [ -f "$cached" ] && verified; then seed "the cache"; fi
          for url in \
            "https://github.com/msys2/msys2-installer/releases/download/$MSYS2_INSTALLER_DATE/$file" \
            "https://repo.msys2.org/distrib/x86_64/$file" \
            "https://mirror.msys2.org/distrib/x86_64/$file" \
            "https://mirrors.tuna.tsinghua.edu.cn/msys2/distrib/x86_64/$file"; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o "$cached" "$url" && verified; then
              seed "$url"
            fi
            echo "::warning::MSYS2 installer download failed: $url"
          done
          echo "::error::MSYS2 installer: every source failed"
          exit 1
      - if: steps.msys2-installer.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msys2-installer
          key: ${{ steps.msys2-installer.outputs.cache-primary-key }}
      # Its package cache needs no gating: a tag restores master's entry, and with the installer pinned
      # and no update the packages match it, so the action skips the save ("Cache unchanged").
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}
      - name: Locate MinGW
        shell: bash
        run: echo "MINGW_HOME=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')/${{ matrix.prefix }}" >> "$GITHUB_ENV"

      # The toolchain's own host is the target: build scripts and the app share one linker.
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            arch=$([ "${{ matrix.host }}" = aarch64-pc-windows-gnullvm ] && echo aarch64 || echo x86_64)
            curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-host "${{ matrix.host }}" --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN-${{ matrix.host }}" --profile minimal
          rustup default "$RUST_TOOLCHAIN-${{ matrix.host }}"
          rustc -vV
      # The registry plus target/ trimmed to the registry dependencies, keyed on the toolchain and
      # Cargo.lock; a new lockfile restores the newest same-target entry. rust-cache drops every crate under
      # desktopRust/ before the save, the vendored gpui patches included, so those rebuild every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: YMusicV4/desktopRust -> target
          key: ${{ matrix.slug }}
          cache-bin: false
          save-if: ${{ env.SAVE_CACHE == 'true' }}

      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        shell: bash
        working-directory: YMusicV4
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          ./decrypt.sh

      # Runs the packed ffmpeg through the app's process runner: it must start, and its Duration line
      # (the Library's durations and @size:seconds playlist codes) must keep its formatting. Its debug
      # build goes outside target/, which the rust cache saves for the release build alone.
      - name: Check the packed ffmpeg
        shell: bash
        working-directory: YMusicV4/desktopRust
        env:
          CC_aarch64_pc_windows_gnullvm: clang
          AR_aarch64_pc_windows_gnullvm: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
        run: |
          set -euo pipefail
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          PATH="$(cygpath -u "$MINGW_HOME")/bin:$PATH" CARGO_TARGET_DIR="$RUNNER_TEMP/ffmpeg-test" \
            cargo test -p ym-ffmpeg --test duration_format

      # The MinGW bin dir goes on PATH for this step alone: gcc/clang load their own DLLs from it (cc1.exe
      # dies silently without them), but it would shadow Git Bash's tools in other steps.
      - name: Stage the app folder
        shell: bash
        working-directory: YMusicV4/desktopRust
        env:
          CC_aarch64_pc_windows_gnullvm: clang
          AR_aarch64_pc_windows_gnullvm: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
        run: |
          set -euo pipefail
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          PATH="$(cygpath -u "$MINGW_HOME")/bin:$PATH" tools/package-windows.sh --out "$GITHUB_WORKSPACE/dist"

      - name: Discard secrets
        if: always()
        shell: bash
        run: rm -rf YMusicV4/secrets.properties YMusicV4/signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-app
          path: dist/YMusic
          if-no-files-found: error

  # Both Inno Setup installers (YMusic-<version>-windows-<x64|arm64>-setup.exe) from the staged app
  # folders, in one job so one SimplySign login signs them all. On a tag, with CERTUM_EMAIL,
  # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID set, every executable and DLL, the uninstaller and the
  # setup carry the Certum code-signing certificate: the job messages the maintainer's phone over
  # Telegram and waits for a SimplySign code (.github/certum-sign.sh). Otherwise unsigned.
  windows-setup:
    needs: [windows]
    runs-on: windows-2022
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/') && secrets.CERTUM_EMAIL != '' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      # github.com/Le-Syl21/ssign (MIT): Certum's cloud API without SimplySign Desktop. Reviewed at this
      # commit (v0.1.11); read the diff before moving it, it handles the login.
      SSIGN_REV: 367bf7d3da14d5041d5e47f855ae2397b8028e33
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-*-app
          path: apps

      # Preinstalled on some runner images only; otherwise the pinned Chocolatey package. Wherever it
      # lands (Inno 7 installs per user), its ISCC.exe is handed to the packaging script as ISCC.
      - name: Install Inno Setup
        shell: bash
        env:
          INNO_SETUP_VERSION: 6.7.1
        run: |
          set -euo pipefail
          find_iscc() {
            ls "/c/Program Files (x86)/Inno Setup "*/ISCC.exe "/c/Program Files/Inno Setup "*/ISCC.exe \
              "$(cygpath -u "$LOCALAPPDATA")/Programs/Inno Setup "*/ISCC.exe 2>/dev/null | head -n 1 || true
          }
          iscc="$(find_iscc)"
          [ -n "$iscc" ] || { choco install innosetup --version "$INNO_SETUP_VERSION" -y --no-progress; iscc="$(find_iscc)"; }
          [ -n "$iscc" ] || { echo "ISCC.exe not found after installing Inno Setup" >&2; exit 1; }
          echo "using $iscc"
          echo "ISCC=$iscc" >> "$GITHUB_ENV"

      # Master builds ssign on a miss and saves it, so a tag's signing only restores it.
      - if: env.SIGN == 'true' || env.SAVE_CACHE == 'true'
        id: ssign-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ssign
          key: ssign-${{ env.SSIGN_REV }}
      # The image's stable MSVC toolchain, as ssign's own CI builds it; --locked takes its Cargo.lock.
      - name: Build ssign
        if: (env.SIGN == 'true' || env.SAVE_CACHE == 'true') && steps.ssign-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --locked --git https://github.com/Le-Syl21/ssign --rev "$SSIGN_REV" --root ssign ssign
      - if: env.SAVE_CACHE == 'true' && steps.ssign-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ssign
          key: ${{ steps.ssign-cache.outputs.cache-primary-key }}

      - name: Package the installers
        shell: bash
        working-directory: YMusicV4/desktopRust
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIGN_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          if [ "$SIGN" = true ]; then
            export SIGN_SCRIPT="$GITHUB_WORKSPACE/YMusicV4/.github/certum-sign.sh"
            export SSIGN="$(cygpath -m "$GITHUB_WORKSPACE/ssign/bin/ssign.exe")"
            export XDG_RUNTIME_DIR="$(cygpath -m "$RUNNER_TEMP")/ssign-runtime"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "::warning::no CERTUM_EMAIL / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID: the Windows installers are unsigned"
          fi
          for arch in x86_64 arm64; do
            out="$GITHUB_WORKSPACE/dist/$arch"
            mkdir -p "$out"
            mv "$GITHUB_WORKSPACE/apps/windows-$arch-app" "$out/YMusic"
            tools/package-windows.sh --setup-only --arch "$arch" --out "$out"
          done

      - name: Verify the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Recurse -Include *.exe, *.dll
          $bad = $files | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          $bad | Format-Table Status, StatusMessage, Path -AutoSize -Wrap
          if ($bad) { throw "$($bad.Count) of $($files.Count) files are not validly signed" }
          "$($files.Count) files validly signed"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64-setup
          path: dist/x86_64/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-setup
          path: dist/arm64/*-setup.exe
          if-no-files-found: error

  # The Debian package the JVM app's updater installs over its own, and an AppImage, unsigned. In an
  # ubuntu:22.04 container: the binaries then need glibc 2.35, not the runner's.
  linux:
    name: linux ${{ matrix.slug }}
    needs: [engine-js, ffmpeg-linux]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      # Whether to open secrets.enc (a tag, and the repo has its passphrase); the passphrase itself goes to
      # the Restore secrets step alone.
      HAS_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SECRETS_PASSPHRASE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: linux-x86_64, runner: ubuntu-24.04, appimage: x86_64,
              appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0,
              runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d }
          - { slug: linux-arm64, runner: ubuntu-24.04-arm, appimage: aarch64,
              appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158,
              runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 }
    steps:
      # git before the checkout: without it actions/checkout falls back to a tarball, which has no submodules.
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl zstd \
            build-essential pkg-config patchelf file openssl libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfreetype-dev libfontconfig-dev libpulse-dev libvulkan-dev

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-js
          path: YMusicV4/engine-js/build/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-${{ matrix.slug }}
          path: ffmpeg-packs
      - name: Unpack the ffmpeg pack
        run: mkdir -p ffmpeg-build/out && tar -xf "ffmpeg-packs/ffmpeg-${{ matrix.slug }}.tar" -C ffmpeg-build/out

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The registry plus target/ trimmed to the registry dependencies, keyed on the toolchain and
      # Cargo.lock; a new lockfile restores the newest same-target entry. rust-cache drops every crate under
      # desktopRust/ before the save, the vendored gpui patches included, so those rebuild every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: YMusicV4/desktopRust -> target
          key: ${{ matrix.slug }}
          cache-bin: false
          save-if: ${{ env.SAVE_CACHE == 'true' }}

      - id: appimage-tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: appimage-tools
          key: appimage-tools-${{ matrix.appimage }}-${{ env.APPIMAGETOOL_VERSION }}-${{ env.APPIMAGE_RUNTIME_VERSION }}
      - name: Fetch the AppImage tooling
        run: |
          mkdir -p appimage-tools
          cd appimage-tools
          [ -f appimagetool ] || curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-${{ matrix.appimage }}.AppImage"
          [ -f runtime ] || curl -fsSL -o runtime "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-${{ matrix.appimage }}"
          printf '%s  appimagetool\n%s  runtime\n' "${{ matrix.appimagetool_sha256 }}" "${{ matrix.runtime_sha256 }}" | sha256sum -c -
          chmod +x appimagetool
      - if: steps.appimage-tools.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: appimage-tools
          key: ${{ steps.appimage-tools.outputs.cache-primary-key }}

      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        working-directory: YMusicV4
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          ./decrypt.sh

      # Runs the packed ffmpeg through the app's process runner: it must start, and its Duration line
      # (the Library's durations and @size:seconds playlist codes) must keep its formatting. Its debug
      # build goes outside target/, which the rust cache saves for the release build alone.
      - name: Check the packed ffmpeg
        working-directory: YMusicV4/desktopRust
        run: |
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          CARGO_TARGET_DIR="$RUNNER_TEMP/ffmpeg-test" cargo test -p ym-ffmpeg --test duration_format

      - name: Package the .deb and the AppImage
        working-directory: YMusicV4/desktopRust
        run: |
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE/YMusicV4"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          APPIMAGETOOL="$GITHUB_WORKSPACE/appimage-tools/appimagetool" APPIMAGE_RUNTIME="$GITHUB_WORKSPACE/appimage-tools/runtime" \
            tools/package-linux.sh --deb --appimage --out "$GITHUB_WORKSPACE/dist"

      - name: Discard secrets
        if: always()
        run: rm -rf YMusicV4/secrets.properties YMusicV4/signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-debug
          path: dist/debug
          if-no-files-found: error

  # Every module's JVM tests; JUnit aborts any test past 30 s (root build.gradle.kts).
  test:
    needs: ffmpeg-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-packs
      - name: Unpack the ffmpeg pack
        run: mkdir -p ffmpeg-build/out && tar -xf "ffmpeg-packs/ffmpeg-macos-arm64.tar" -C ffmpeg-build/out
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Gradle User Home (wrapper, dependencies, the build cache), saved by master only.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}
      # The npm cache npx installs esbuild and typescript from, keyed on their pins.
      - id: npx
        working-directory: YMusicV4
        shell: bash
        run: |
          version() { sed -n "s/.*const val $1 = \"\([^\"]*\)\".*/\1/p" buildSrc/src/main/kotlin/Dependencies.kt; }
          echo "key=npx-$RUNNER_OS-$RUNNER_ARCH-esbuild$(version esbuild)-typescript$(version typescript)" >> "$GITHUB_OUTPUT"
      - id: npx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}
      - working-directory: YMusicV4
        run: >-
          ./gradlew --continue -Pci=true
          :commonUi:jvmTest
          :desktopApp:jvmTest
          :download:jvmTest
          :dynamic-engine:jvmTest
          :image-loader:jvmTest
          :kmpCommon:jvmTest
          :kmpFfmpeg:jvmTest
          :kmpHttp:core:jvmTest
          :kmpHttp:json:jvmTest
          :media-scanner:jvmTest
          :media-store:jvmTest
          :player:jvmTest
          :projectCommon:jvmTest
          :quickjs:jvmTest
          :remote-config:jvmTest
          :settings:jvmTest
          :telemetry:jvmTest
          :yt-media:jvmTest
      # Saved even when a test fails: the downloads are the same either way.
      - if: always() && steps.npx-cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ steps.npx.outputs.key }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: YMusicV4/**/build/reports/tests/
          if-no-files-found: ignore

  # Today's engine.js / player.js (the engine-js job's) on the host of shipped tags from
  # compat/floor.txt on, one concurrent job per tag (compat/README.md): five of them spread evenly by
  # index, always the floor and the newest.
  compat-tags:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the tags
      - id: tags
        env:
          COMPAT_SPREAD: 5
        run: echo "tags=$(compat/tags.sh --json)" >> "$GITHUB_OUTPUT"

  compat:
    needs: [engine-js, compat-tags]
    if: needs.compat-tags.outputs.tags != '[]'
    name: compat ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.compat-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.tag }}
          path: host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-js
          path: bundles
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Restore-only on every ref: each shipped tag's host resolves its own dependency set, and an entry
      # per tag would cost ~0.5 GB of the 10 GB cache budget each. It restores master's android job's
      # entry (the only Linux one), which holds most of what an old host needs.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - run: head/compat/overlay.sh host bundles
      - working-directory: host
        run: ./gradlew :dynamic-engine:jvmTest --tests 'io.ymusic.dynamicengine.compat.*' --rerun
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ matrix.tag }}
          path: host/dynamic-engine/build/reports/tests/jvmTest

  # A DRAFT GitHub Release for the tag with every artifact attached: nothing is public until it is
  # reviewed and published by hand. Off a tag it stops after collecting the files: a dry run of the
  # asset names.
  release:
    needs: [android, macos, windows-setup, linux, test, compat]
    runs-on: ubuntu-24.04
    env:
      # Whether to open secrets.enc (a tag, and the repo has its passphrase); the passphrase itself goes to
      # the Restore secrets step alone.
      HAS_SECRETS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SECRETS_PASSPHRASE != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          # Asset names carry the version (update-config.mjs builds the same names). Each glob must match exactly one build output.
          version="$(sed -n 's/^ymusic\.versionName=//p' YMusicV4/gradle.properties | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "ymusic.versionName not found" >&2; exit 1; }
          one() { set -- $1; [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one file for: $*" >&2; exit 1; }; echo "$1"; }
          cp "$(one 'artifacts/android-apks/*-armeabi-v7a-release.apk')" "release/YMusic-$version-android-armv7.apk"
          cp "$(one 'artifacts/android-apks/*-arm64-v8a-release.apk')" "release/YMusic-$version-android-arm64.apk"
          cp "$(one 'artifacts/android-apks/*-x86-release.apk')" "release/YMusic-$version-android-x86.apk"
          cp "$(one 'artifacts/android-apks/*-x86_64-release.apk')" "release/YMusic-$version-android-x86_64.apk"
          cp "$(one 'artifacts/macos-arm64-dmg/*.dmg')" "release/YMusic-$version-macos-arm64.dmg"
          cp "$(one 'artifacts/macos-x86_64-dmg/*.dmg')" "release/YMusic-$version-macos-intel.dmg"
          cp "$(one 'artifacts/windows-x86_64-setup/*.exe')" "release/YMusic-$version-windows-x64-setup.exe"
          cp "$(one 'artifacts/windows-arm64-setup/*.exe')" "release/YMusic-$version-windows-arm64-setup.exe"
          cp "$(one 'artifacts/linux-x86_64-packages/*.deb')" "release/YMusic-$version-linux-x86_64.deb"
          cp "$(one 'artifacts/linux-arm64-packages/*.deb')" "release/YMusic-$version-linux-arm64.deb"
          cp "$(one 'artifacts/linux-x86_64-packages/*.AppImage')" "release/YMusic-$version-linux-x86_64.AppImage"
          cp "$(one 'artifacts/linux-arm64-packages/*.AppImage')" "release/YMusic-$version-linux-arm64.AppImage"
          cp "$(one 'artifacts/js-bundles/engine.*.js')" "$(one 'artifacts/js-bundles/player.*.js')" release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release

      # update-config.json: the releases/engineJs/playerJs entries for the server's App config.
      # The update dialog's notes are an annotated tag's message (git tag -a … -m "notes"); a
      # lightweight tag gives none. The dialog shows 7 lines (UpdateDialog.kt ChangeNotes).
      # Each platform family gets its own notes: the lines under its "[android]" / "[macos]" / "[windows]" / "[linux]" header; a
      # message without headers goes to every family (AGENTS.md "Release flow").
      # The signing keys come from secrets.enc (bundle.signing.* / update.* in secrets.properties).
      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        working-directory: YMusicV4
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: ./decrypt.sh

      # Fetched on every ref, so master saves it for the tags.
      - id: sentry-cli
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sentry-cli
          key: sentry-cli-Linux-x86_64-${{ env.SENTRY_CLI_VERSION }}
      - name: Fetch sentry-cli
        run: |
          set -euo pipefail
          cli=sentry-cli/sentry-cli
          mkdir -p sentry-cli
          [ -f "$cli" ] || curl -fsSL --retry 3 -o "$cli" "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64"
          echo "$SENTRY_CLI_SHA256  $cli" | sha256sum -c -
          chmod +x "$cli"
      - if: steps.sentry-cli.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sentry-cli
          key: ${{ steps.sentry-cli.outputs.cache-primary-key }}

      # The Rust desktop app's macOS dSYMs and unstripped Linux binaries (its packaging scripts'
      # <out>/debug), so its panic frames symbolicate with file:line. Windows has none yet.
      - name: Upload the desktop debug files to Sentry
        if: env.IS_TAG == 'true'
        env:
          SENTRY_ORG: na-6d
          SENTRY_PROJECT: ymusic-kmp
        run: |
          set -euo pipefail
          token="$(sed -n 's/^sentry\.auth\.token=//p' YMusicV4/secrets.properties 2>/dev/null | head -n 1)"
          [ -n "$token" ] || { echo "no sentry.auth.token in secrets.properties" >&2; exit 1; }
          echo "::add-mask::$token"
          SENTRY_AUTH_TOKEN="$token" sentry-cli/sentry-cli debug-files upload --type dsym --type elf \
            artifacts/macos-arm64-debug artifacts/macos-x86_64-debug artifacts/linux-x86_64-debug artifacts/linux-arm64-debug

      - name: Build the update config
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          message="$RUNNER_TEMP/tag-message.txt"
          notes="$RUNNER_TEMP/notes"
          mkdir -p "$notes"
          git -C YMusicV4 fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git -C YMusicV4 cat-file -t "refs/tags/$TAG")" = tag ]; then
            git -C YMusicV4 for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed -e 's/[[:space:]]*$//' > "$message"
          else
            : > "$message"
          fi
          for family in android macos windows linux; do
            awk -v family="$family" '
              /^\[[a-z]+\]$/ {
                section = substr($0, 2, length($0) - 2)
                if (section != "android" && section != "macos" && section != "windows" && section != "linux") {
                  print "unknown notes section [" section "]" > "/dev/stderr"; exit 1
                }
                next
              }
              /./ && (section == "" || section == family) { print }
            ' "$message" > "$notes/notes-$family.txt"
            if [ "$(grep -c . "$notes/notes-$family.txt")" -gt 7 ] || [ "$(awk 'length > 40' "$notes/notes-$family.txt" | wc -l)" -gt 0 ]; then
              echo "::warning::$family release notes exceed 7 lines of 40 chars; the update dialog cuts them off"
            fi
            { echo "### $family update notes"; echo '```'; cat "$notes/notes-$family.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          node YMusicV4/.github/update-config.mjs release "$GITHUB_REPOSITORY" "$TAG" YMusicV4 "$notes" \
            > release/update-config.json
          { echo '### update-config.json'; echo '```json'; cat release/update-config.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: rm -rf secrets.properties signing

      - if: env.IS_TAG == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-config
          path: release/update-config.json
          if-no-files-found: error

      # Release notes: GitHub's "Full Changelog" compare line, the trusted-sources warning, then this
      # version's section of CHANGELOG.md (the tag's "## <version>", e.g. release-v4.0.5 → "## 4.0.5"),
      # then a Downloads table linking every platform's assets; a prerelease carries no CHANGELOG section.
      - name: Build the release notes
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > "$notes"
          cat >> "$notes" <<'EOF'
          > [!CAUTION]
          > **Only install YMusic from trusted sources:** [ymusic.io](https://ymusic.io) or [GitHub Releases](https://github.com/ymusic-io/YMusicV4/releases). Anyone can build a modified copy — bad actors can ship a fake app that steals your Google account credentials when you sign in.

          EOF
          if [[ "$TAG" != prerelease-* ]]; then
            version="${TAG#*-v}"
            section="$(awk -v head="## $version" '$0 == head { found = 1 } found && /^## / && $0 != head { exit } found' YMusicV4/CHANGELOG.md)"
            if [ -z "$section" ]; then
              echo "::warning::CHANGELOG.md has no '## $version' section; the release notes carry only the compare link"
            else
              printf '\n%s\n' "$section" >> "$notes"
            fi
          fi
          version="$(sed -n 's/^ymusic\.versionName=//p' YMusicV4/gradle.properties | tr -d '[:space:]')"
          # A link per asset, each checked against the collected files; they work once the draft is published.
          links() {
            local row="" file
            while [ $# -gt 0 ]; do
              file="YMusic-$version-$2"
              [ -f "release/$file" ] || { echo "no release/$file for the downloads table" >&2; return 1; }
              row+="${row:+ · }[$1](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file)"
              shift 2
            done
            echo "$row"
          }
          android="$(links arm64 android-arm64.apk armv7 android-armv7.apk x86_64 android-x86_64.apk x86 android-x86.apk)"
          macos="$(links 'Apple Silicon' macos-arm64.dmg Intel macos-intel.dmg)"
          windows="$(links x64 windows-x64-setup.exe arm64 windows-arm64-setup.exe)"
          linux="$(links 'x86_64 .deb' linux-x86_64.deb 'arm64 .deb' linux-arm64.deb 'x86_64 AppImage' linux-x86_64.AppImage 'arm64 AppImage' linux-arm64.AppImage)"
          cat >> "$notes" <<EOF

          ## Downloads

          | Platform | Download |
          | --- | --- |
          | Android | $android |
          | macOS | $macos |
          | Windows | $windows |
          | Linux | $linux |

          Checksums: [SHA256SUMS](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS)
          EOF
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          prerelease=()
          [[ "$TAG" == prerelease-* ]] && prerelease=(--prerelease)
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)"
          case "$draft" in
            "")    gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" \
                     --title "$TAG" --notes-file "$notes" ;;
            # A re-run of the tag refreshes its draft's files and notes.
            true)  gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
                   gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" ;;
            *)     echo "release $TAG is already published; not touching it" >&2; exit 1 ;;
          esac
