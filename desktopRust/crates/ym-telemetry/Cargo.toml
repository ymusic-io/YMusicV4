[package]
name = "ym-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex = "1"
ym-common = { path = "../ym-common" }
ym-logstore = { path = "../ym-logstore" }
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio.workspace = true
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "reqwest", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation"] }

[lints]
workspace = true
